<style>
/* ============================================================
   PortoBank Performance — Styles
   ------------------------------------------------------------
   Design system por variáveis CSS. Quatro temas trocáveis em
   tempo real via [data-theme] no <body>:
     portobank (azul Porto) · rosa · brasil · dark
   ============================================================ */

/* ------------------------- Temas ------------------------- */
:root, body[data-theme="portobank"] {
  --primary: #00A1FC;          /* azul Porto */
  --primary-deep: #001E64;     /* navy institucional */
  --primary-soft: #E3F4FF;
  --bg: #F2F6FB;
  --surface: #FFFFFF;
  --text: #14243E;
  --text-soft: #5A6B85;
  --border: #E1E8F2;
  --ok: #1DB954; --warn: #F5A623; --danger: #E5484D;
  --shadow: 0 6px 24px rgba(0, 30, 100, .08);
}
body[data-theme="rosa"] {
  --primary: #E91E8C;
  --primary-deep: #5C0A3C;
  --primary-soft: #FDE7F3;
  --bg: #FBF3F8;
  --surface: #FFFFFF;
  --text: #3A1029;
  --text-soft: #8A5B75;
  --border: #F2DCE9;
  --shadow: 0 6px 24px rgba(92, 10, 60, .10);
}
body[data-theme="brasil"] {
  --primary: #009C3B;
  --primary-deep: #002776;
  --primary-soft: #E6F7EC;
  --bg: #F5FAF3;
  --surface: #FFFFFF;
  --text: #10331C;
  --text-soft: #4F6E58;
  --border: #DCEEDF;
  --warn: #FFDF00;
  --shadow: 0 6px 24px rgba(0, 39, 118, .10);
}
body[data-theme="dark"] {
  --primary: #35B5FF;
  --primary-deep: #0A1430;
  --primary-soft: #10233F;
  --bg: #0B1220;
  --surface: #131C2E;
  --text: #E8EEF8;
  --text-soft: #8FA0BC;
  --border: #22304A;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
}

/* ------------------------ Reset base ---------------------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  transition: background .3s ease, color .3s ease;
}
h1, h2, h3 { font-family: 'Sora', 'Inter', sans-serif; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }
.mono { font-family: monospace; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* -------------------------- Splash ------------------------ */
#splash {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  background: linear-gradient(160deg, var(--primary-deep), var(--primary));
  color: #fff; text-align: center; padding: 24px; z-index: 99;
}
#splash h1 { font-size: 1.6rem; }
#splash p  { opacity: .85; max-width: 420px; font-size: .9rem; }
.splash-logo {
  width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
  background: rgba(255,255,255,.15); font-family: 'Sora'; font-weight: 700; font-size: 1.6rem;
  animation: pulse 1.6s ease infinite;
}
.loader {
  width: 34px; height: 34px; border-radius: 50%;
  border: 4px solid rgba(255,255,255,.3); border-top-color: #fff;
  animation: spin .9s linear infinite; margin-top: 8px;
}
@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(1.06); } }
@keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ------------------------- Layout ------------------------- */
.app { display: flex; min-height: 100vh; }
.main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Sidebar recolhível */
.sidebar {
  width: 248px; background: var(--primary-deep); color: #fff;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  transition: width .25s ease; z-index: 20;
}
.sidebar.collapsed { width: 72px; }
.sidebar.collapsed .brand-text, .sidebar.collapsed .menu-label,
.sidebar.collapsed .user-info { display: none; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 14px; }
.brand-badge {
  min-width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--primary); font-family: 'Sora'; font-weight: 700;
}
.brand-text strong { display: block; font-family: 'Sora'; }
.brand-text small { opacity: .7; font-size: .72rem; }
.menu { list-style: none; flex: 1; overflow-y: auto; padding: 8px; }
.menu a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px;
  color: rgba(255,255,255,.82); text-decoration: none; border-radius: 12px;
  font-size: .92rem; transition: background .2s ease;
}
.menu a:hover { background: rgba(255,255,255,.09); }
.menu a.active { background: var(--primary); color: #fff; font-weight: 600; }
.sidebar-footer { padding: 12px; border-top: 1px solid rgba(255,255,255,.12); }
.user-chip { display: flex; gap: 10px; align-items: center; }
.avatar {
  min-width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--primary); font-weight: 700; text-transform: uppercase;
}
.user-info strong { display: block; font-size: .85rem; }
.user-info small { opacity: .7; font-size: .7rem; }

/* Topbar */
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 14px 22px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.topbar h2 { font-size: 1.15rem; flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

/* Troca de tema */
.theme-switch { display: flex; gap: 6px; padding: 4px; background: var(--bg); border-radius: 999px; }
.theme-switch button {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface);
  transition: transform .15s ease;
}
.theme-switch button:hover { transform: scale(1.15); }
.theme-switch [data-theme-set="portobank"] { background: linear-gradient(135deg,#001E64,#00A1FC); }
.theme-switch [data-theme-set="rosa"]      { background: linear-gradient(135deg,#5C0A3C,#E91E8C); }
.theme-switch [data-theme-set="brasil"]    { background: linear-gradient(135deg,#009C3B,#FFDF00 60%,#002776); }
.theme-switch [data-theme-set="dark"]      { background: linear-gradient(135deg,#0B1220,#35B5FF); }

/* ------------------------ Componentes --------------------- */
.content { padding: 22px; animation: rise .3s ease; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
  animation: rise .35s ease;
}
.center-card { max-width: 440px; margin: 8vh auto; text-align: center; display: grid; gap: 10px; justify-items: center; }
.big-icon { font-size: 44px; color: var(--primary); }

.grid { display: grid; gap: 16px; }
.grid-kpi { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.grid-2   { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

.kpi { display: grid; gap: 4px; }
.kpi .kpi-label { color: var(--text-soft); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
.kpi .kpi-value { font-family: 'Sora'; font-size: 1.7rem; font-weight: 700; }
.kpi .kpi-sub   { font-size: .8rem; color: var(--text-soft); }

/* Semáforo de meta */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.verde    { color: var(--ok);     background: color-mix(in srgb, var(--ok) 12%, transparent); }
.pill.amarelo  { color: var(--warn);   background: color-mix(in srgb, var(--warn) 15%, transparent); }
.pill.vermelho { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

.progress { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s ease; }
.progress.verde > span { background: var(--ok); }
.progress.amarelo > span { background: var(--warn); }
.progress.vermelho > span { background: var(--danger); }

/* Botões */
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: none;
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .88rem;
  transition: transform .12s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent); }
.btn-ghost { background: var(--primary-soft); color: var(--primary); }
.btn-danger { background: var(--danger); color: #fff; }
.icon-btn { background: transparent; border: none; color: inherit; display: grid; place-items: center; padding: 6px; border-radius: 10px; }
.icon-btn:hover { background: rgba(128,128,128,.15); }

/* Formulários */
form.form { display: grid; gap: 14px; }
.form-row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
label.field { display: grid; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--text-soft); }
label.field input, label.field select, label.field textarea {
  padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--text); font-size: .95rem; font-family: inherit;
  transition: border-color .2s ease;
}
label.field input:focus, label.field select:focus, label.field textarea:focus {
  border-color: var(--primary); outline: none;
}

/* Tabelas */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.data th, table.data td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--border); }
table.data th { color: var(--text-soft); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; }
table.data tr:hover td { background: var(--primary-soft); }
tr.destaque td { background: color-mix(in srgb, var(--primary) 10%, transparent); font-weight: 600; }

/* Paginação e busca */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar input[type="search"] {
  flex: 1; min-width: 180px; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: 999px; background: var(--surface); color: var(--text);
}
.paginacao { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; font-size: .85rem; }

/* Toast */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120%);
  background: var(--primary-deep); color: #fff; padding: 12px 22px; border-radius: 14px;
  box-shadow: var(--shadow); transition: transform .3s ease; z-index: 100; max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.erro { background: var(--danger); }
.toast.ok   { background: var(--ok); }

/* Gráficos */
.chart { width: 100%; min-height: 280px; }

/* ---------------------- Responsividade -------------------- */
.only-mobile { display: none; }
@media (max-width: 860px) {
  .only-mobile { display: grid; }
  .sidebar {
    position: fixed; left: 0; top: 0; transform: translateX(-100%);
    transition: transform .25s ease; width: 248px !important;
  }
  .sidebar.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
  .sidebar.collapsed .brand-text, .sidebar.collapsed .menu-label,
  .sidebar.collapsed .user-info { display: block; }
  #btn-collapse { display: none; }
  .quick-label { display: none; }
  .content { padding: 14px; }
  .topbar { padding: 10px 14px; }
}
</style>
