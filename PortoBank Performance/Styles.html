<style>
/* ============================================================
   PortoBank Performance — Styles
   ------------------------------------------------------------
   Design system por variáveis CSS, baseado no layout de
   referência. Quatro temas trocáveis em tempo real via
   [data-theme] no <body>: portobank · rosa · brasil · dark
   ============================================================ */

/* ------------------------- Temas ------------------------- */
:root, body[data-theme="portobank"] {
  --primary: #00A1FC;          /* azul Porto */
  --primary-deep: #001E64;     /* navy institucional */
  --primary-soft: #E3F4FF;
  --bg: #F2F6FB;
  --surface: #FFFFFF;
  --surface-2: #F7FAFE;
  --ink: #14243E;
  --ink-2: #5A6B85;
  --line: #E1E8F2;
  --ok: #1DB954; --warn: #F5A623; --bad: #E5484D;
  --shadow: 0 6px 24px rgba(0, 30, 100, .08);
}
body[data-theme="rosa"] {
  --primary: #E91E8C;
  --primary-deep: #5C0A3C;
  --primary-soft: #FDE7F3;
  --bg: #FBF3F8;
  --surface: #FFFFFF;
  --surface-2: #FDF7FB;
  --ink: #3A1029;
  --ink-2: #8A5B75;
  --line: #F2DCE9;
  --shadow: 0 6px 24px rgba(92, 10, 60, .10);
}
body[data-theme="brasil"] {
  --primary: #009C3B;
  --primary-deep: #002776;
  --primary-soft: #E6F7EC;
  --bg: #F5FAF3;
  --surface: #FFFFFF;
  --surface-2: #F5FBF4;
  --ink: #10331C;
  --ink-2: #4F6E58;
  --line: #DCEEDF;
  --warn: #D4A900;
  --shadow: 0 6px 24px rgba(0, 39, 118, .10);
}
body[data-theme="dark"] {
  --primary: #35B5FF;
  --primary-deep: #0A1430;
  --primary-soft: #10233F;
  --bg: #0B1220;
  --surface: #131C2E;
  --surface-2: #182338;
  --ink: #E8EEF8;
  --ink-2: #8FA0BC;
  --line: #22304A;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
}
/* Aliases usados pelos gráficos e componentes existentes */
:root, body[data-theme] { --accent: var(--primary); --accent-soft: var(--primary-soft); }

/* ------------------------ Reset base ---------------------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  transition: background .3s ease, color .3s ease;
}
h1, h2, h3 { font-family: 'Sora', 'Inter', sans-serif; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--ink-2); font-size: .84rem; }
.material-icons-round { font-size: 20px; line-height: 1; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(1.06); } }
@keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* -------------------------- Splash ------------------------ */
#splash {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  background: linear-gradient(160deg, var(--primary-deep), var(--primary));
  color: #fff; text-align: center; padding: 24px; z-index: 99;
}
#splash h1 { font-size: 1.6rem; }
#splash p  { opacity: .85; max-width: 420px; font-size: .9rem; }
.splash-logo {
  width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
  background: rgba(255,255,255,.15); font-family: 'Sora'; font-weight: 700; font-size: 1.6rem;
  animation: pulse 1.6s ease infinite;
}
.loader {
  width: 34px; height: 34px; border-radius: 50%;
  border: 4px solid rgba(255,255,255,.3); border-top-color: #fff;
  animation: spin .9s linear infinite; margin-top: 8px;
}

/* --------------------- Acesso negado ---------------------- */
#denied { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.denied-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); max-width: 440px; padding: 28px; text-align: center;
  display: grid; gap: 10px; justify-items: center;
}
.denied-card .big-icon { font-size: 44px; color: var(--primary); }
.denied-card p { color: var(--ink-2); font-size: .9rem; }

/* ------------------------- Layout ------------------------- */
#app { display: flex; min-height: 100vh; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Sidebar recolhível */
#sidebar {
  width: 248px; background: var(--primary-deep); color: #fff;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  transition: width .25s ease; z-index: 20;
}
#sidebar.collapsed { width: 72px; }
#sidebar.collapsed .brand-name, #sidebar.collapsed .menu-label,
#sidebar.collapsed .user-meta { display: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 14px; }
.brand-mark {
  min-width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--primary); font-family: 'Sora'; font-weight: 700; color: #fff;
}
.brand-name strong { display: block; font-family: 'Sora'; font-size: .95rem; }
.brand-name small { opacity: .7; font-size: .72rem; }
#collapseBtn { margin-left: auto; }

#nav { flex: 1; overflow-y: auto; padding: 8px; display: grid; gap: 2px; align-content: start; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; width: 100%;
  color: rgba(255,255,255,.82); background: transparent; border: none; text-align: left;
  border-radius: 12px; font-size: .92rem; transition: background .2s ease;
}
.nav-item:hover { background: rgba(255,255,255,.09); }
.nav-item.active { background: var(--primary); color: #fff; font-weight: 600; }
.nav-item .ico { font-size: 20px; }

.sidebar-footer { padding: 12px; border-top: 1px solid rgba(255,255,255,.12); }
.user-chip { display: flex; gap: 10px; align-items: center; }
.avatar {
  min-width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--primary); color: #fff; font-weight: 700; text-transform: uppercase; font-size: .82rem;
}
.user-meta strong { display: block; font-size: .85rem; }
.user-meta small { opacity: .7; font-size: .7rem; }

/* Topbar */
#topbar {
  display: flex; align-items: center; gap: 14px; padding: 14px 22px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
}
#topbar h1 { font-size: 1.15rem; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.icon-btn {
  background: transparent; border: none; color: inherit;
  display: grid; place-items: center; padding: 6px; border-radius: 10px;
}
.icon-btn:hover { background: rgba(128,128,128,.15); }
.month-picker {
  padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: .85rem;
}

/* Ações rápidas */
.quick-label { white-space: nowrap; }

/* Troca de tema (bolinhas de gradiente) */
#themeRow { display: flex; gap: 6px; padding: 4px; background: var(--bg); border-radius: 999px; }
.theme-dot {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface);
  transition: transform .15s ease; padding: 0;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { outline: 2px solid var(--primary); outline-offset: 1px; }
.theme-dot[data-t="portobank"] { background: linear-gradient(135deg,#001E64,#00A1FC); }
.theme-dot[data-t="rosa"]      { background: linear-gradient(135deg,#5C0A3C,#E91E8C); }
.theme-dot[data-t="brasil"]    { background: linear-gradient(135deg,#009C3B,#FFDF00 60%,#002776); }
.theme-dot[data-t="dark"]      { background: linear-gradient(135deg,#0B1220,#35B5FF); }

/* ------------------------ Conteúdo ------------------------ */
#content { padding: 22px; animation: rise .3s ease; }
.section-title { margin: 22px 0 12px; font-size: 1rem; color: var(--ink); }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
  animation: rise .35s ease;
}
.card h3 { font-size: .95rem; margin-bottom: 12px; }

.grid { display: grid; gap: 16px; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.grid.two  { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

/* KPI */
.kpi { display: grid; gap: 4px; align-content: start; }
.kpi-label { color: var(--ink-2); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
.kpi-value { font-family: 'Sora'; font-size: 1.7rem; font-weight: 700; }
.kpi-sub   { font-size: .8rem; color: var(--ink-2); }
.kpi.ok   .kpi-value { color: var(--ok); }
.kpi.warn .kpi-value { color: var(--warn); }
.kpi.bad  .kpi-value { color: var(--bad); }

/* Badges / pílulas (semáforo) */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
  border-radius: 999px; font-size: .78rem; font-weight: 600;
  color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line);
}
.badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.badge.ok      { color: var(--ok);   background: color-mix(in srgb, var(--ok) 12%, transparent);   border-color: transparent; }
.badge.warn    { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); border-color: transparent; }
.badge.neutral { color: var(--ink-2); }
.pill-list { display: flex; flex-wrap: wrap; gap: 8px; }

/* Barra de progresso */
.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s ease; }
.progress.ok > div { background: var(--ok); }

/* Botões */
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: none;
  padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .88rem;
  background: var(--primary); color: #fff;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent);
  transition: transform .12s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.97); }
.btn.ghost  { background: var(--primary-soft); color: var(--primary); box-shadow: none; }
.btn.danger { background: var(--bad); color: #fff; box-shadow: none; }
.btn.small  { padding: 6px 10px; font-size: .8rem; border-radius: 10px; box-shadow: none; }

/* Formulários */
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
input, select, textarea {
  width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font-size: .95rem; font-family: inherit;
  transition: border-color .2s ease;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
.form-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }

/* Tabelas */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--ink-2); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; }
tbody tr:hover td { background: var(--primary-soft); }
tr.me td { background: color-mix(in srgb, var(--primary) 10%, transparent); font-weight: 600; }
.pos-medal { font-size: 1.1rem; }

/* Configurações */
.settings-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.settings-row:last-child { border-bottom: none; }
.settings-row .grow { flex: 1; min-width: 0; }

/* Vazio */
.empty {
  padding: 26px; text-align: center; color: var(--ink-2); font-size: .88rem;
  background: var(--surface-2); border: 1px dashed var(--line); border-radius: 14px;
}

/* Gráficos */
.chart-box { position: relative; height: 300px; }

/* Toast (inferior central, empilhável) */
#toasts {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  display: grid; gap: 8px; z-index: 100; max-width: 90vw; justify-items: center;
}
.toast {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--primary-deep); color: #fff; padding: 12px 22px; border-radius: 14px;
  box-shadow: var(--shadow); animation: rise .25s ease; font-size: .9rem;
}
.toast.error { background: var(--bad); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .25s ease; }
.toast .t-ico { display: grid; place-items: center; }

/* Modal */
#modalBackdrop {
  position: fixed; inset: 0; background: rgba(10, 20, 48, .55);
  display: grid; place-items: center; z-index: 90; padding: 18px;
}
#modal {
  background: var(--surface); color: var(--ink); border-radius: 18px;
  box-shadow: var(--shadow); width: min(560px, 100%); max-height: 88vh;
  overflow-y: auto; padding: 20px; animation: rise .25s ease;
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal-head h3 { font-size: 1rem; }

/* ---------------------- Responsividade -------------------- */
.only-mobile { display: none; }
@media (max-width: 860px) {
  .only-mobile { display: grid; }
  #sidebar {
    position: fixed; left: 0; top: 0; transform: translateX(-100%);
    transition: transform .25s ease; width: 248px !important;
  }
  #sidebar.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
  #sidebar.collapsed .brand-name, #sidebar.collapsed .menu-label,
  #sidebar.collapsed .user-meta { display: block; }
  #collapseBtn { display: none; }
  .quick-label { display: none; }
  #content { padding: 14px; }
  #topbar { padding: 10px 14px; }
}
</style>
